name: convertara

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: convertara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-convertara}
      POSTGRES_DB: convertara
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U convertara']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-convertara}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-convertara-secret}
    ports:
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api-env
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://convertara:${POSTGRES_PASSWORD:-convertara}@postgres:5432/convertara
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: convertara
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-convertara}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-convertara-secret}
      S3_FORCE_PATH_STYLE: 'true'
      # Required before any provider API key can be stored.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env - generate with: openssl rand -hex 32}
      AI_MODE: ${AI_MODE:-auto}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      ARTIFACT_TTL_SECONDS: ${ARTIFACT_TTL_SECONDS:-86400}
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    restart: unless-stopped

  # The warm pool. Scale it independently of the API:
  #   docker compose up -d --scale worker=4
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/queue/worker-main.js']
    environment:
      <<: *api-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:4000
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
